name: Release

# Builds the Windows installers from a version tag and publishes the GitHub
# release with a signed updater manifest (latest.json). Installed copies of
# Vidra Studio pick the update up automatically through the Tauri updater,
# which refuses any installer whose signature does not match the public key.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: apps/desktop/src-tauri }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Optional Authenticode signing: configure the WINDOWS_CERTIFICATE (base64
      # .pfx) and WINDOWS_CERTIFICATE_PASSWORD secrets. Without them the
      # installers are UNSIGNED and SIGNING.txt + the release notes say so.
      - name: Import code-signing certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No certificate configured; building unsigned."; exit 0 }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $secure = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $path
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        shell: pwsh
        env:
          # Updater signing key (minisign). Without it the build fails, so an
          # unsigned update can never be published.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $extra = @()
          if ($env:SIGNING_THUMBPRINT) {
            $cfg = @{ bundle = @{ windows = @{ certificateThumbprint = $env:SIGNING_THUMBPRINT; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } | ConvertTo-Json -Depth 5 -Compress
            Set-Content -Path sign.json -Value $cfg
            $extra = @("--config", "sign.json")
          }
          pnpm --filter @vidra/desktop tauri build @extra

      - name: Collect artifacts, checksums and signing status
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected tag: $env:TAG" }
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          # GitHub replaces spaces in asset names with dots; name files that way
          # up front so SHA256SUMS.txt matches the published asset names.
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -Include *-setup.exe | ForEach-Object { Copy-Item $_.FullName (Join-Path release-artifacts ($_.Name -replace ' ', '.')) }
          Copy-Item apps/desktop/src-tauri/target/release/vidra-studio.exe release-artifacts/Vidra-Studio-portable.exe
          $sums = Get-ChildItem release-artifacts -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content release-artifacts/SHA256SUMS.txt
          # Updater manifest: points at the published installer and carries its signature.
          $setup = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($setup.FullName).sig" -Raw
          $asset = $setup.Name -replace ' ', '.'
          $version = $env:TAG.TrimStart('v')
          $manifest = [ordered]@{
            version = $version
            notes = "See https://github.com/tolga-ileri/vidra-studio/blob/main/CHANGELOG.md"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "https://github.com/tolga-ileri/vidra-studio/releases/download/$($env:TAG)/$asset" } }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content release-artifacts/latest.json
          # Gate: the published signature must verify against the public key
          # embedded in the app, independently of Tauri, or nothing is released.
          node scripts/verify-update-signature.mjs (Join-Path release-artifacts $asset) release-artifacts/latest.json
          if ($LASTEXITCODE -ne 0) { throw "Updater signature verification failed" }
          $state = if ($env:SIGNING_THUMBPRINT) { "Authenticode-signed" } else { "UNSIGNED (no code-signing certificate configured)" }
          "Windows binaries in this release are: $state." | Set-Content release-artifacts/SIGNING.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vidra-studio-windows
          path: release-artifacts/

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }} # passed via env, never interpolated into the script
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected tag: $env:TAG" }
          $notes = (Get-Content release-artifacts/SIGNING.txt -Raw) + "`nVerify downloads against SHA256SUMS.txt. See CHANGELOG.md for changes."
          gh release create $env:TAG (Get-ChildItem release-artifacts -File).FullName --latest --title "Vidra Studio $env:TAG" --notes $notes
