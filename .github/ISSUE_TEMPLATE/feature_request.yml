name: Feature or provider request
description: Suggest an improvement or a new provider/model
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: docs
    attributes:
      label: Official API documentation
      description: For providers/models, link the provider's official API docs. Vidra only integrates documented, official APIs.
