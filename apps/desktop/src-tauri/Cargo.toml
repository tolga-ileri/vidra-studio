[package]
name = "vidra-studio"
version = "0.1.0"
description = "Vidra Studio - local-first desktop studio for AI video and image generation"
authors = ["Tolga Ileri"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "vidra_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "multipart", "http2"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
base64 = "0.23"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs4 = { version = "0.12", features = ["sync"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
url = "2"
rand = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4"
async-trait = "0.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
# Test-only: lets the real app run end to end against a local mock provider
# server (env-configured base URL, loopback http, isolated data dir, dialog
# overrides). Never enabled for releases; see src/e2e.rs.
e2e-mock = []
